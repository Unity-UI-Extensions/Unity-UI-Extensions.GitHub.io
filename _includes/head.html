<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

{% seo %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/neon.css' | relative_url }}">
<!-- Favicon — SVG primary (Chrome 80+, Firefox 41+, Safari 12+, Edge 80+) -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/logo.svg' | relative_url }}">
<!-- Fallback for older browsers that only accept .ico -->
<link rel="shortcut icon" href="{{ '/assets/img/logo.svg' | relative_url }}">
<!-- iOS home screen icon -->
<link rel="apple-touch-icon" href="{{ '/assets/img/logo.svg' | relative_url }}">
<!-- Browser chrome accent colour -->
<meta name="theme-color" content="#050508">
