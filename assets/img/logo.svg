<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0099"/>
      <stop offset="100%" stop-color="#00ffee"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0099" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ffee" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#0a0a14"/>

  <!-- Subtle inner glow -->
  <rect x="1" y="1" width="30" height="30" rx="6.5" fill="url(#glow)"/>
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#0a0a14"/>

  <!-- U shape built from paths (renders cleanly at any size) -->
  <!-- Left leg -->
  <rect x="7" y="7" width="5" height="14" rx="1.5" fill="url(#grad)"/>
  <!-- Right leg -->
  <rect x="20" y="7" width="5" height="14" rx="1.5" fill="url(#grad)"/>
  <!-- Bottom curve / crossbar -->
  <rect x="7" y="18" width="18" height="5" rx="2.5" fill="url(#grad)"/>
</svg>
