<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Unity UI Toolkit Extensions icon">
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffee"/><stop offset="100%" stop-color="#0044aa"/>
    </linearGradient>
    <radialGradient id="ig" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#00ffee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00ffee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowR" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(0,255,238,0.20)"/><stop offset="100%" stop-color="rgba(0,255,238,0)"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
