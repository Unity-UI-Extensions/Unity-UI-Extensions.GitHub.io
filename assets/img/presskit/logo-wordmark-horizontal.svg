<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Unity UI Extensions">
  <defs>
    <!-- Signature brand gradient: 135deg magenta -> cyan -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(-45 0.5 0.5)">
      <stop offset="0%" stop-color="#ff0099"/>
      <stop offset="100%" stop-color="#00ffee"/>
    </linearGradient>
    <!-- Horizontal version of the brand gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0099"/>
      <stop offset="100%" stop-color="#00ffee"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#ff0099" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#00ffee" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00ffee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0099" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Transparent background (no fill rect) -->

  <!-- Icon tile at left -->
  <g>
    <rect x="40" y="48" width="224" height="224" rx="40" fill="#0a0a14"/>
    <rect x="40.75" y="48.75" width="222.5" height="222.5" rx="39.25" fill="none" stroke="url(#brandGrad)" stroke-width="1.5" opacity="0.6"/>
    <rect x="40" y="48" width="224" height="224" rx="40" fill="url(#tileSheen)"/>
    <rect x="40" y="48" width="224" height="224" rx="40" fill="url(#innerGlow)"/>
    <!-- U monogram -->
    <g fill="url(#brandGrad)">
      <rect x="94" y="100" width="34" height="104" rx="4"/>
      <rect x="176" y="100" width="34" height="104" rx="4"/>
      <rect x="94" y="196" width="116" height="34" rx="4"/>
    </g>
  </g>

  <!-- Wordmark: UNITY UI EXTENSIONS, uppercase, letter-spaced, Orbitron stack -->
  <text x="312" y="150" font-family="Orbitron, 'Space Grotesk', system-ui, sans-serif" font-size="66" font-weight="700" letter-spacing="6" fill="#ffffff">UNITY UI</text>
  <text x="312" y="226" font-family="Orbitron, 'Space Grotesk', system-ui, sans-serif" font-size="66" font-weight="700" letter-spacing="6" fill="#ffffff">EXTENSIONS</text>

</svg>
