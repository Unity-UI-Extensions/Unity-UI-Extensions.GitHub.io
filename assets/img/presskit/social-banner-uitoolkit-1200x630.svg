<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Unity UI Toolkit Extensions v1.0.0-pre.1">
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffee"/><stop offset="100%" stop-color="#0044aa"/>
    </linearGradient>
    <radialGradient id="ig" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#00ffee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00ffee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowR" cx="22%" cy="32%" r="60%">
      <stop offset="0%" stop-color="rgba(0,255,238,0.20)"/><stop offset="100%" stop-color="rgba(0,255,238,0)"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="rgba(0,255,238,0.025)"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#050508"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>
  <rect width="1200" height="630" fill="url(#scan)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="rgba(0,255,238,0.18)" stroke-width="1"/>

  <!-- decorative large monogram, faint, right -->
  <g opacity="0.10"><g fill="#00ffee">
      <rect x="940" y="150" width="60" height="200" rx="7.199999999999999"/>
      <rect x="1090" y="150" width="60" height="200" rx="7.199999999999999"/>
      <rect x="940" y="290" width="210" height="60" rx="7.199999999999999"/>
    </g></g>

  <!-- logo lockup -->
  <g transform="translate(72,64)">
    <rect x="0" y="0" width="64" height="64" rx="6" fill="#0a0a14" stroke="rgba(0,255,238,0.35)" stroke-width="1"/>
    <g fill="url(#pg)">
      <rect x="18" y="16" width="8" height="24" rx="0.96"/>
      <rect x="38" y="16" width="8" height="24" rx="0.96"/>
      <rect x="18" y="32" width="28" height="8" rx="0.96"/>
    </g>
    <text x="82" y="28" font-family="Orbitron, 'Space Grotesk', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="3" fill="#ffffff">UNITY UI EXTENSIONS</text>
    <text x="82" y="52" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#00ffcc">v1.0.0-pre.1 // UI Toolkit package</text>
  </g>

  <!-- headline -->
  <g transform="translate(72,230)">
    <text font-family="Orbitron, 'Space Grotesk', system-ui, sans-serif" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="0" y="0" font-size="66">20 MODERN</tspan>
      <tspan x="0" y="78" font-size="66" fill="#00ffee">UI TOOLKIT CONTROLS</tspan>
    </text>
    <text x="4" y="140" font-family="Inter, system-ui, sans-serif" font-size="23" fill="#00ffcc">USS-themable, data-driven controls for Unity 6’s modern runtime UI. MIT licensed.</text>
  </g>

  <!-- stat chips -->
  <g transform="translate(72,438)" font-family="'JetBrains Mono', ui-monospace, monospace">
    <g>
      <rect x="0" y="0" width="220" height="58" rx="2" fill="rgba(0,255,238,0.08)" stroke="rgba(0,255,238,0.35)"/>
      <text x="22" y="38" font-size="30" font-weight="700" fill="#00ffee" filter="url(#softGlow)">20</text>
      <text x="92" y="35" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#ffffff">controls</text>
    </g>
    <g transform="translate(244,0)">
      <rect x="0" y="0" width="220" height="58" rx="2" fill="rgba(0,255,238,0.08)" stroke="rgba(0,255,238,0.35)"/>
      <text x="22" y="38" font-size="30" font-weight="700" fill="#00ffee" filter="url(#softGlow)">8</text>
      <text x="70" y="35" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#ffffff">example scenes</text>
    </g>
    <g transform="translate(488,0)">
      <rect x="0" y="0" width="220" height="58" rx="2" fill="rgba(0,255,238,0.08)" stroke="rgba(0,255,238,0.35)"/>
      <text x="22" y="38" font-size="26" font-weight="700" fill="url(#pg)">MIT</text>
      <text x="118" y="35" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#ffffff">licence</text>
    </g>
  </g>
</svg>
