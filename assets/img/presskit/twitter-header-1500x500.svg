<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-label="Unity UI Extensions — Two packages. One ecosystem.">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0099"/>
      <stop offset="100%" stop-color="#00ffee"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0099"/>
      <stop offset="55%" stop-color="#aa1188"/>
      <stop offset="100%" stop-color="#00ffee"/>
    </linearGradient>
    <radialGradient id="glowMag" cx="10%" cy="50%" r="55%">
      <stop offset="0%" stop-color="rgba(255,0,153,0.20)"/>
      <stop offset="100%" stop-color="rgba(255,0,153,0)"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="92%" cy="55%" r="55%">
      <stop offset="0%" stop-color="rgba(0,255,238,0.18)"/>
      <stop offset="100%" stop-color="rgba(0,255,238,0)"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="rgba(255,0,153,0.025)"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="#050508"/>
  <rect width="1500" height="500" fill="url(#glowMag)"/>
  <rect width="1500" height="500" fill="url(#glowCyan)"/>
  <rect width="1500" height="500" fill="url(#scan)"/>

  <!-- centre glow line connecting the two packages -->
  <rect x="0" y="249" width="1500" height="2" fill="url(#sweep)" opacity="0.35"/>

  <!-- Big monogram -->
  <g transform="translate(120,150)">
    <rect x="0" y="0" width="200" height="200" rx="6" fill="#0a0a14" stroke="rgba(255,0,153,0.35)" stroke-width="1.5"/>
    <g fill="url(#brandGrad)" filter="url(#softGlow)">
      <rect x="56" y="50" width="24" height="74"/>
      <rect x="120" y="50" width="24" height="74"/>
      <rect x="56" y="124" width="88" height="24"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <g transform="translate(372,200)">
    <text x="0" y="0" font-family="Orbitron, 'Space Grotesk', system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="4" fill="#ffffff">UNITY UI EXTENSIONS</text>
    <text x="4" y="58" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="600" letter-spacing="1" fill="#dd88ff">Two packages. <tspan fill="url(#brandGrad)">One ecosystem.</tspan></text>
  </g>

  <!-- package colour chips -->
  <g transform="translate(376,300)" font-family="'JetBrains Mono', ui-monospace, monospace">
    <rect x="0" y="0" width="150" height="40" rx="2" fill="rgba(255,0,153,0.06)" stroke="rgba(255,0,153,0.35)"/>
    <text x="20" y="26" font-size="15" fill="#ff66cc">uGUI · magenta</text>
    <rect x="164" y="0" width="178" height="40" rx="2" fill="rgba(0,255,238,0.06)" stroke="rgba(0,255,238,0.35)"/>
    <text x="184" y="26" font-size="15" fill="#00ffee">UI Toolkit · cyan</text>
  </g>

  <!-- right edge: two stacked package ticks -->
  <g transform="translate(1230,150)" font-family="'JetBrains Mono', ui-monospace, monospace">
    <rect x="0" y="0" width="170" height="86" rx="2" fill="rgba(255,0,153,0.07)" stroke="rgba(255,0,153,0.35)"/>
    <text x="18" y="34" font-family="Orbitron, sans-serif" font-size="26" font-weight="700" fill="#ff0099" filter="url(#softGlow)">101</text>
    <text x="18" y="62" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#ffffff">uGUI controls</text>
    <rect x="0" y="98" width="170" height="86" rx="2" fill="rgba(0,255,238,0.06)" stroke="rgba(0,255,238,0.35)"/>
    <text x="18" y="132" font-family="Orbitron, sans-serif" font-size="26" font-weight="700" fill="#00ffee" filter="url(#softGlow)">25</text>
    <text x="18" y="160" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#ffffff">UITK controls</text>
  </g>
</svg>
