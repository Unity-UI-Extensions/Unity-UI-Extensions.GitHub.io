<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 816" width="1456" height="816" role="img" aria-label="Unity UI Toolkit Extensions v1.0.0-pre.1">
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffee"/><stop offset="100%" stop-color="#0044aa"/>
    </linearGradient>
    <radialGradient id="ig" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#00ffee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00ffee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowR" cx="28%" cy="52%" r="60%">
      <stop offset="0%" stop-color="rgba(0,255,238,0.20)"/><stop offset="100%" stop-color="rgba(0,255,238,0)"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="rgba(0,255,238,0.025)"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1456" height="816" fill="#050508"/>
  <rect width="1456" height="816" fill="url(#glowR)"/>
  <rect width="1456" height="816" fill="url(#scan)"/>

  <!-- header lockup -->
  <g transform="translate(64,56)">
    <rect x="0" y="0" width="72" height="72" rx="8" fill="#0a0a14" stroke="rgba(0,255,238,0.35)" stroke-width="1.5"/>
    <g fill="url(#pg)">
      <rect x="20" y="18" width="9" height="28" rx="1.08"/>
      <rect x="43" y="18" width="9" height="28" rx="1.08"/>
      <rect x="20" y="37" width="32" height="9" rx="1.08"/>
    </g>
    <text x="92" y="32" font-family="Orbitron, 'Space Grotesk', system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="4" fill="#ffffff">UNITY UI EXTENSIONS</text>
    <text x="94" y="60" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" letter-spacing="2" fill="#00ffcc">v1.0.0-pre.1 // UI Toolkit package</text>
  </g>

  <!-- main panel -->
  <g transform="translate(96,196)">
    <rect x="0" y="0" width="1264" height="556" rx="6" fill="rgba(0,255,238,0.05)" stroke="rgba(0,255,238,0.35)" stroke-width="1.5"/>
    <rect x="0" y="0" width="1264" height="6" fill="url(#pg)"/>

    <text x="56" y="150" font-family="Orbitron, 'Space Grotesk', system-ui, sans-serif" font-size="100" font-weight="800" letter-spacing="2" fill="#00ffee" filter="url(#softGlow)">UI TOOLKIT</text>
    <text x="60" y="196" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Unity UI Toolkit Extensions</text>
    <text x="60" y="232" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" fill="#00ffcc">com.unity.uitoolkitextensions</text>

    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" fill="#ffffff">
      <text x="60" y="300">v1.0.0-pre.1</text>
      <text x="60" y="334">Unity 6000.0+</text>
      <text x="60" y="368">Licence: MIT</text>
    </g>

    <g transform="translate(60,400)">
      <text x="0" y="74" font-family="Orbitron, 'Space Grotesk', system-ui, sans-serif" font-size="96" font-weight="800" fill="#00ffee" filter="url(#softGlow)">20</text>
      <text x="0" y="104" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#00ffcc">controls</text>
      <text x="320" y="74" font-family="Orbitron, 'Space Grotesk', system-ui, sans-serif" font-size="96" font-weight="800" fill="#00ffee" filter="url(#softGlow)">8</text>
      <text x="320" y="104" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#00ffcc">example scenes</text>
    </g>

    <text x="60" y="528" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#336677">USS / data-driven UI · fully themable</text>

    <!-- right: large monogram + relaunch pill -->
    <g transform="translate(944,118)">
      
    <rect x="0" y="0" width="280" height="280" rx="48" fill="#0a0a14"/>
    <rect x="0.75" y="0.75" width="278.5" height="278.5" rx="47.25" fill="none" stroke="url(#pg)" stroke-width="1.5" opacity="0.6"/>
    <rect x="0" y="0" width="280" height="280" rx="48" fill="url(#sheen)"/>
    <rect x="0" y="0" width="280" height="280" rx="48" fill="url(#ig)"/>
      <g fill="url(#pg)">
      <rect x="64" y="64" width="40" height="124" rx="4.8"/>
      <rect x="164" y="64" width="40" height="124" rx="4.8"/>
      <rect x="64" y="148" width="140" height="40" rx="4.8"/>
    </g>
      <g transform="translate(40,300)">
        <rect x="0" y="0" width="200" height="44" rx="3" fill="rgba(0,255,238,0.10)" stroke="url(#pg)" stroke-width="1.2"/>
        <text x="100" y="29" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" letter-spacing="3" fill="#ffffff">3.0 RELAUNCH</text>
      </g>
    </g>
  </g>

  <text x="728" y="790" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Modern, USS-themable controls built for Unity 6’s UI Toolkit runtime.</text>
</svg>
